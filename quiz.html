<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizWave — Quiz</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="quiz-body">
  <header class="topbar">
    <div class="brand-inline">
      <span class="brand-icon">🧠</span>
      <span class="brand-name">QuizWave</span>
    </div>
    <nav class="topbar-nav">
      <a href="home.html" class="back-link">← Home</a>
    </nav>
  </header>

  <main class="quiz-main">
    <div class="quiz-header">
      <h1 id="quiz-title">Quiz</h1>
      <div class="progress-info">
        <span id="question-counter">Question 1 / 20</span>
        <span id="timer-text" class="timer-text">⏱ 20s</span>
        <span id="score-counter">Score: 0</span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
    </div>

    <section id="quiz-card" class="quiz-card-play">
      <h2 id="question-text" class="question-text">Loading…</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" hidden></p>
      <button id="next-btn" class="btn-primary" hidden>Next Question</button>
    </section>

    <section id="results-card" class="results-card" hidden>
      <div class="results-emoji" id="results-emoji">🏁</div>
      <h2 id="results-title">Quiz Complete!</h2>
      <p id="results-score" class="results-score"></p>
      <p id="results-message" class="results-message"></p>
      <p id="results-best" class="results-best" hidden></p>
      <div class="results-actions">
        <button id="retry-btn" class="btn-primary">Play Again</button>
        <a href="home.html" class="btn-secondary">Back to Home</a>
      </div>
    </section>
  </main>

  <script src="js/quizzes.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
