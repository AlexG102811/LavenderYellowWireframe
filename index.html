<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizWave — Sign In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <div class="brand">
        <span class="brand-icon">🧠</span>
        <h1>QuizWave</h1>
        <p class="tagline">Test your knowledge. Ride the wave.</p>
      </div>

      <!-- Tab switcher -->
      <div class="tabs" role="tablist">
        <button id="tab-signin" class="tab active" role="tab" aria-selected="true">Sign In</button>
        <button id="tab-signup" class="tab" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form id="signin-form" class="auth-form" novalidate>
        <label for="signin-username">Username</label>
        <input id="signin-username" name="username" type="text" autocomplete="username" placeholder="your_username" required />

        <label for="signin-password">Password</label>
        <input id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember-me" checked /> Remember me
          </label>
          <a href="#" class="forgot" id="forgot-link">Forgot password?</a>
        </div>

        <p id="signin-error" class="error-msg" role="alert" hidden></p>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form" hidden novalidate>
        <label for="signup-username">Username</label>
        <input id="signup-username" name="username" type="text" autocomplete="username" placeholder="pick a username" required />

        <label for="signup-password">Password</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="min. 6 characters" required />

        <label for="signup-confirm">Confirm Password</label>
        <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="repeat password" required />

        <p id="signup-error" class="error-msg" role="alert" hidden></p>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="guest-hint">Just exploring? <a href="#" id="guest-link">Continue as guest</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
